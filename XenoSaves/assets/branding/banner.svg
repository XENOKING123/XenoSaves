<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-label="XENOSAVES - PS5 and PS4 save manager, editor and community">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05060a"/>
      <stop offset="0.55" stop-color="#0a1606"/>
      <stop offset="1" stop-color="#132a05"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9ff000"/>
      <stop offset="1" stop-color="#d6ff4d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#bcff1c" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#bcff1c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="300" fill="url(#bg)"/>
  <ellipse cx="1050" cy="80" rx="420" ry="260" fill="url(#glow)"/>
  <ellipse cx="180" cy="300" rx="360" ry="200" fill="url(#glow)" opacity="0.5"/>

  <!-- shield logo mark -->
  <g transform="translate(96 150)">
    <path d="M0,-70 L58,-48 L58,18 C58,58 30,84 0,96 C-30,84 -58,58 -58,18 L-58,-48 Z" fill="#0b1206" stroke="url(#lime)" stroke-width="5"/>
    <g stroke="url(#lime)" stroke-width="13" stroke-linecap="round">
      <line x1="-26" y1="-20" x2="26" y2="28"/>
      <line x1="26" y1="-20" x2="-26" y2="28"/>
    </g>
    <circle cx="0" cy="4" r="11" fill="#0b1206" stroke="url(#lime)" stroke-width="5"/>
  </g>

  <!-- wordmark -->
  <text x="208" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="2" fill="#ffffff">XENO<tspan fill="url(#lime)">SAVES</tspan></text>
  <text x="212" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600" letter-spacing="3" fill="#aab6a0">PS5 &amp; PS4 SAVE MANAGER &#183; EDITOR &#183; COMMUNITY</text>

  <!-- wave -->
  <path d="M0,250 C220,210 420,290 640,258 C860,226 1060,296 1280,256 L1280,300 L0,300 Z" fill="#bcff1c" opacity="0.14"/>
  <path d="M0,270 C240,238 440,300 680,274 C900,250 1080,300 1280,276 L1280,300 L0,300 Z" fill="#bcff1c" opacity="0.22"/>
</svg>
